server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Variable upstream so nginx boots even while Directus restarts (Docker DNS).
    # rewrite + proxy_pass without URI strips the /directus prefix: Vite dev proxy parity.
    location /directus/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $directus_upstream http://directus:8055;
        rewrite ^/directus/(.*)$ /$1 break;
        proxy_pass $directus_upstream;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 64m;
    }

    location = /directus {
        return 301 /directus/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
